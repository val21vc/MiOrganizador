<ScrollView>
    <StackLayout class="page">

        <Label
            text="Nueva tarea"
            class="titulo">
        </Label>

        <Label
            text="Agrega una actividad a tu lista."
            class="subtitulo">
        </Label>

        <TextField
            hint="Escribe el nombre de tu tarea"
            [(ngModel)]="nombre"
            class="campo-texto">
        </TextField>

        <Label
            *ngIf="mensajeError"
            [text]="mensajeError"
            class="mensaje-error">
        </Label>

        <Button
            text="Guardar tarea"
            class="boton-principal"
            (tap)="guardarTarea()">
        </Button>

        <Button
            text="Cancelar"
            class="boton-secundario"
            (tap)="cancelar()">
        </Button>

    </StackLayout>
</ScrollView>
